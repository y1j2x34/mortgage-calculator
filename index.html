<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房贷计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { num: ['Outfit', 'sans-serif'] },
                    colors: {
                        bg: '#0e0e10', 'bg-s': '#141416', card: '#18181b',
                        bdr: '#27272a', 'bdr-h': '#3f3f46',
                        fg: '#fafaf9', fg2: '#d4d4d8', mt: '#71717a',
                        ac: '#f59e0b', 'ac-h': '#fbbf24',
                        gn: '#22c55e', rd: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0e0e10; color: #fafaf9; min-height: 100vh; overflow-x: hidden;
        }
        .font-num { font-family: 'Outfit', sans-serif; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .glow-a, .glow-b { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; }
        .glow-a {
            top: -200px; right: -140px; width: 580px; height: 580px;
            background: radial-gradient(circle, rgba(245,158,11,0.055) 0%, transparent 70%);
            animation: gf1 9s ease-in-out infinite;
        }
        .glow-b {
            bottom: -280px; left: -180px; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(245,158,11,0.03) 0%, transparent 70%);
            animation: gf2 12s ease-in-out infinite;
        }
        @keyframes gf1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,35px) scale(1.08)} }
        @keyframes gf2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(22px,-28px) scale(1.06)} }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(22px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-enter { animation: cardIn 0.38s cubic-bezier(0.22, 1, 0.36, 1); }

        @keyframes toastIn { from { transform: translateX(140%); } to { transform: translateX(0); } }
        @keyframes toastOut { from { transform: translateX(0); } to { transform: translateX(140%); } }
        .toast-in { animation: toastIn 0.32s cubic-bezier(0.22,1,0.36,1) forwards; }
        .toast-out { animation: toastOut 0.28s ease-in forwards; }

        .hscroll::-webkit-scrollbar { height: 5px; }
        .hscroll::-webkit-scrollbar-track { background: #0e0e10; border-radius: 3px; }
        .hscroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        .hscroll::-webkit-scrollbar-thumb:hover { background: #71717a; }

        .vscroll::-webkit-scrollbar { width: 3px; }
        .vscroll::-webkit-scrollbar-track { background: transparent; }
        .vscroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

        .ratio-bar { height: 7px; border-radius: 4px; overflow: hidden; display: flex; background: rgba(239,68,68,0.1); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect, useMemo } = React;

        /* ===================== 方案主题色 ===================== */
        const PALETTE = [
            { a: '#f59e0b', g: 'rgba(245,158,11,0.12)' },
            { a: '#38bdf8', g: 'rgba(56,189,248,0.12)' },
            { a: '#c084fc', g: 'rgba(192,132,252,0.12)' },
            { a: '#f472b6', g: 'rgba(244,114,182,0.12)' },
            { a: '#34d399', g: 'rgba(52,211,153,0.12)' },
            { a: '#fb923c', g: 'rgba(251,146,60,0.12)' },
        ];

        /* ===================== 计算函数 ===================== */
        function calcEP(P, ar, n) {
            const r = ar / 100 / 12;
            if (r === 0) {
                const mp = P / n;
                const rows = Array.from({ length: n }, (_, i) => ({
                    m: i + 1, p: mp, i: 0, t: mp, rem: Math.max(0, P - (i + 1) * mp)
                }));
                return { rows, total: P, interest: 0, mp };
            }
            const mp = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            let rem = P;
            const rows = [];
            for (let k = 1; k <= n; k++) {
                const interest = rem * r;
                const principal = mp - interest;
                rem = Math.max(0, rem - principal);
                rows.push({ m: k, p: principal, i: interest, t: mp, rem });
            }
            return { rows, total: mp * n, interest: mp * n - P, mp };
        }

        function calcEC(P, ar, n) {
            const r = ar / 100 / 12;
            const mp = P / n;
            let rem = P;
            const rows = [];
            for (let k = 1; k <= n; k++) {
                const interest = rem * r;
                const total = mp + interest;
                rem = Math.max(0, rem - mp);
                rows.push({ m: k, p: mp, i: interest, t: total, rem });
            }
            const sum = rows.reduce((s, d) => s + d.t, 0);
            return { rows, total: sum, interest: sum - P, first: rows[0].t, last: rows[rows.length - 1].t };
        }

        function fmt(n) {
            return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        /* ===================== Toast ===================== */
        function Toast({ msg, type, visible, onDone }) {
            const [leaving, setLeaving] = useState(false);
            useEffect(() => {
                if (!visible) return;
                setLeaving(false);
                const t1 = setTimeout(() => setLeaving(true), 2000);
                const t2 = setTimeout(() => onDone(), 2300);
                return () => { clearTimeout(t1); clearTimeout(t2); };
            }, [msg, visible]);
            if (!visible) return null;
            const icons = { ok: 'check_circle', err: 'error', info: 'info' };
            const cls = { ok: 'border-gn text-gn', err: 'border-rd text-rd', info: 'border-bdr text-fg2' };
            return (
                <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl text-sm flex items-center gap-2 border bg-card shadow-2xl shadow-black/50 ${cls[type]} ${leaving ? 'toast-out' : 'toast-in'}`}
                     role="status" aria-live="polite">
                    <span className="material-symbols-rounded" style={{ fontSize: 18 }}>{icons[type]}</span>
                    {msg}
                </div>
            );
        }

        /* ===================== 虚拟滚动表格 ===================== */
        const ROW_H = 30;
        const BUFFER = 6;

        function VirtualTable({ rows }) {
            const scrollRef = useRef(null);
            const [scrollTop, setScrollTop] = useState(0);
            const [viewH, setViewH] = useState(260);

            useEffect(() => {
                const el = scrollRef.current;
                if (!el) return;
                setViewH(el.clientHeight);
                const onScroll = () => setScrollTop(el.scrollTop);
                const ro = new ResizeObserver(entries => {
                    if (entries[0]) setViewH(entries[0].contentRect.height);
                });
                el.addEventListener('scroll', onScroll, { passive: true });
                ro.observe(el);
                return () => { el.removeEventListener('scroll', onScroll); ro.disconnect(); };
            }, []);

            const totalH = rows.length * ROW_H;
            const startIdx = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
            const endIdx = Math.min(rows.length, Math.ceil((scrollTop + viewH) / ROW_H) + BUFFER);
            const visible = rows.slice(startIdx, endIdx);

            return (
                <div>
                    <div className="grid grid-cols-4 text-xs font-semibold text-mt px-4 py-1.5 bg-bg-s border-b border-bdr-h">
                        <span>期数</span>
                        <span className="text-gn">本金</span>
                        <span className="text-rd">利息</span>
                        <span className="text-fg2">月供</span>
                    </div>
                    <div ref={scrollRef} className="vscroll" style={{ height: 260, overflowY: 'auto', position: 'relative' }}>
                        <div style={{ height: totalH, position: 'relative' }}>
                            {visible.map(r => (
                                <div key={r.m}
                                     className="grid grid-cols-4 text-xs px-4 items-center border-b border-bdr/50"
                                     style={{
                                         position: 'absolute', top: (r.m - 1) * ROW_H,
                                         height: ROW_H, left: 0, right: 0,
                                         transition: 'background 0.1s',
                                     }}
                                     onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.02)'}
                                     onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                                    <span className="text-mt">{r.m}</span>
                                    <span className="font-num text-gn">{fmt(r.p)}</span>
                                    <span className="font-num text-rd">{fmt(r.i)}</span>
                                    <span className="font-num text-fg2">{fmt(r.t)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        /* ===================== 对比卡片 ===================== */
        function CompareCard({ data, isBest, onRemove }) {
            const c = data.color;
            const pRatio = (data.amt * 10000 / data.total * 100).toFixed(1);
            const iRatio = (data.interest / data.total * 100).toFixed(1);

            const monthlyBlock = data.type === 'ep' ? (
                <>
                    <div className="flex flex-col gap-0.5">
                        <span className="text-[11px] text-mt">每月还款</span>
                        <span className="font-num text-[17px] font-bold" style={{ color: c.a }}>{fmt(data.mp)}</span>
                    </div>
                    <div className="flex flex-col gap-0.5">
                        <span className="text-[11px] text-mt">还款特征</span>
                        <span className="text-xs text-mt leading-relaxed">月供固定<br/>本金递增 · 利息递减</span>
                    </div>
                </>
            ) : (
                <>
                    <div className="flex flex-col gap-0.5">
                        <span className="text-[11px] text-mt">首月还款</span>
                        <span className="font-num text-[17px] font-bold" style={{ color: c.a }}>{fmt(data.first)}</span>
                    </div>
                    <div className="flex flex-col gap-0.5">
                        <span className="text-[11px] text-mt">末月还款</span>
                        <span className="font-num text-[17px] font-bold" style={{ color: c.a }}>{fmt(data.last)}</span>
                    </div>
                </>
            );

            return (
                <article className="flex-shrink-0 w-[400px] bg-card border border-bdr rounded-2xl overflow-hidden card-enter
                                     transition-all duration-300 hover:-translate-y-0.5 hover:border-bdr-h hover:shadow-xl hover:shadow-black/30"
                         aria-label={`方案${data.id}`}>
                    <div className="h-[3px]" style={{ background: c.a }}></div>
                    <div className="flex items-center justify-between px-4 pt-3 pb-1.5">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-num text-sm font-bold" style={{ color: c.a }}>方案 {data.id}</span>
                            <span className="text-[11px] font-medium px-2.5 py-0.5 rounded-md"
                                  style={{ background: c.g, color: c.a }}>{data.typeName}</span>
                            {isBest && (
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-gn/10 text-gn">利息最低</span>
                            )}
                        </div>
                        <button onClick={() => onRemove(data.id)}
                                className="w-7 h-7 rounded-md flex items-center justify-center text-mt hover:bg-rd/10 hover:text-rd transition-colors duration-200"
                                aria-label={`删除方案${data.id}`}>
                            <span className="material-symbols-rounded" style={{ fontSize: 16 }}>close</span>
                        </button>
                    </div>
                    <div className="px-4 pb-2.5 flex flex-wrap gap-x-3 text-xs text-mt">
                        <span>{data.amt} 万</span>
                        <span>利率 {data.rate}%</span>
                        <span>{data.years} 年（{data.months} 期）</span>
                    </div>
                    <div className="px-4 pb-3 grid grid-cols-2 gap-x-4 gap-y-3">
                        <div className="flex flex-col gap-0.5">
                            <span className="text-[11px] text-mt">总还款额</span>
                            <span className="font-num text-[17px] font-bold text-fg">{fmt(data.total)}</span>
                        </div>
                        <div className="flex flex-col gap-0.5">
                            <span className="text-[11px] text-mt">总利息</span>
                            <span className="font-num text-[17px] font-bold text-rd">{fmt(data.interest)}</span>
                        </div>
                        {monthlyBlock}
                    </div>
                    <div className="px-4 pb-3">
                        <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-gn">本金 {pRatio}%</span>
                            <span className="text-rd">利息 {iRatio}%</span>
                        </div>
                        <div className="ratio-bar">
                            <div className="bg-gn transition-all duration-500" style={{ width: pRatio + '%' }}></div>
                            <div className="bg-rd transition-all duration-500" style={{ width: iRatio + '%' }}></div>
                        </div>
                    </div>
                    <div className="border-t border-bdr">
                        <VirtualTable rows={data.rows} />
                    </div>
                </article>
            );
        }

        /* ===================== 输入面板 ===================== */
        function InputPanel({ onAdd }) {
            const [amt, setAmt] = useState('100');
            const [rate, setRate] = useState('3.50');
            const [years, setYears] = useState('30');
            const [type, setType] = useState('ep');

            const setQuickRate = useCallback(v => setRate(v.toFixed(2)), []);

            const doAdd = useCallback(() => {
                const a = parseFloat(amt);
                const r = parseFloat(rate);
                const y = parseFloat(years);
                if (!a || a <= 0) { onAdd(null, '请输入有效的贷款金额'); return; }
                if (!r || r <= 0) { onAdd(null, '请输入有效的年利率'); return; }
                if (!y || y < 1) { onAdd(null, '贷款年限需大于 1 年'); return; }
                const months = Math.max(1, Math.round(y * 12));
                onAdd({ amt: a, rate: r, years: y, months, type }, null);
            }, [amt, rate, years, type, onAdd]);

            const onKey = useCallback(e => { if (e.key === 'Enter') doAdd(); }, [doAdd]);

            const ic = "bg-bg border border-bdr text-fg rounded-xl px-3.5 py-2.5 text-[15px] w-full outline-none transition-all duration-200 focus:border-ac focus:shadow-[0_0_0_3px_rgba(245,158,11,0.12)] placeholder:text-mt font-num";

            return (
                <section className="p-5 sm:p-6 rounded-2xl mb-7 bg-card border border-bdr" aria-label="贷款参数输入">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 items-end">
                        <div>
                            <label className="block text-xs font-medium text-mt mb-2">贷款金额（万元）</label>
                            <input type="number" className={ic} placeholder="100" value={amt}
                                   onChange={e => setAmt(e.target.value)} onKeyDown={onKey} aria-label="贷款金额" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-mt mb-2">年利率（%）</label>
                            <input type="number" className={ic} placeholder="3.50" value={rate} step="0.01"
                                   onChange={e => setRate(e.target.value)} onKeyDown={onKey} aria-label="年利率" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-mt mb-2">贷款年限（年）</label>
                            <input type="number" className={ic} placeholder="30" value={years} step="any"
                                   onChange={e => setYears(e.target.value)} onKeyDown={onKey} aria-label="贷款年限" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-mt mb-2">还款方式</label>
                            <div className="flex bg-bg border border-bdr rounded-xl overflow-hidden" role="radiogroup" aria-label="还款方式">
                                <button className={`flex-1 py-2.5 text-sm transition-all duration-200 border-0 cursor-pointer ${type === 'ep' ? 'bg-ac text-bg font-semibold' : 'bg-transparent text-mt hover:text-fg hover:bg-bdr'}`}
                                        role="radio" aria-checked={type === 'ep'} onClick={() => setType('ep')}>等额本息</button>
                                <button className={`flex-1 py-2.5 text-sm transition-all duration-200 border-0 cursor-pointer ${type === 'ec' ? 'bg-ac text-bg font-semibold' : 'bg-transparent text-mt hover:text-fg hover:bg-bdr'}`}
                                        role="radio" aria-checked={type === 'ec'} onClick={() => setType('ec')}>等额本金</button>
                            </div>
                        </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-2 mt-4">
                        <span className="text-xs text-mt mr-0.5">快捷利率</span>
                        {[['公积金', 2.85], ['商贷', 3.10], ['商贷', 3.50], ['商贷', 4.20]].map(([label, v]) => (
                            <button key={v} onClick={() => setQuickRate(v)}
                                    className="text-xs px-3 py-1.5 rounded-lg border border-bdr text-mt bg-transparent cursor-pointer transition-all duration-200 hover:border-ac hover:text-ac hover:bg-ac/10">
                                {label} {v}%
                            </button>
                        ))}
                        <div className="flex-1"></div>
                        <button onClick={doAdd}
                                className="inline-flex items-center gap-1.5 px-6 py-2.5 rounded-xl text-[15px] font-semibold border-0 cursor-pointer bg-ac text-bg transition-all duration-200 hover:bg-ac-h hover:-translate-y-px hover:shadow-lg hover:shadow-ac/15 active:translate-y-0">
                            <span className="material-symbols-rounded" style={{ fontSize: 18 }}>add</span>
                            添加到对比
                        </button>
                    </div>
                </section>
            );
        }

        /* ===================== 主应用 ===================== */
        function App() {
            const [schemes, setSchemes] = useState([]);
            const [seq, setSeq] = useState(0);
            const [toast, setToast] = useState({ msg: '', type: 'info', visible: false });

            const showToast = useCallback((msg, type = 'info') => setToast({ msg, type, visible: true }), []);
            const hideToast = useCallback(() => setToast(p => ({ ...p, visible: false })), []);

            const handleAdd = useCallback((data, err) => {
                if (err) { showToast(err, 'err'); return; }
                if (schemes.length >= 6) { showToast('最多支持 6 个方案对比', 'err'); return; }
                const P = data.amt * 10000;
                let res;
                if (data.type === 'ep') {
                    res = calcEP(P, data.rate, data.months);
                    res.type = 'ep'; res.typeName = '等额本息';
                } else {
                    res = calcEC(P, data.rate, data.months);
                    res.type = 'ec'; res.typeName = '等额本金';
                }
                const nid = seq + 1;
                setSeq(nid);
                setSchemes(prev => [...prev, {
                    id: nid, amt: data.amt, rate: data.rate, years: data.years, months: data.months,
                    ...res, color: PALETTE[(nid - 1) % PALETTE.length]
                }]);
                showToast('方案 ' + nid + ' 已添加', 'ok');
            }, [schemes.length, seq, showToast]);

            const handleRemove = useCallback(id => setSchemes(prev => prev.filter(s => s.id !== id)), []);
            const handleClear = useCallback(() => {
                if (!schemes.length) return;
                setSchemes([]); setSeq(0); showToast('已清空全部方案');
            }, [schemes.length, showToast]);

            const bestId = useMemo(() => {
                if (schemes.length < 2) return null;
                let min = Infinity, bid = null;
                schemes.forEach(s => { if (s.interest < min) { min = s.interest; bid = s.id; } });
                return bid;
            }, [schemes]);

            return (
                <div className="relative z-10 max-w-[1480px] mx-auto px-5 sm:px-8 py-8">
                    <Toast msg={toast.msg} type={toast.type} visible={toast.visible} onDone={hideToast} />
                    <header className="mb-7">
                        <h1 className="font-num text-3xl sm:text-4xl font-black tracking-tight text-fg">Mortgage Calculator</h1>
                        <p className="mt-1.5 text-sm text-mt">自由调整参数，添加多个方案横向滑动对比，虚拟滚动高效渲染每月还款明细</p>
                    </header>
                    <main>
                        <InputPanel onAdd={handleAdd} />
                        {schemes.length > 0 && (
                            <div className="flex items-center justify-between mb-4">
                                <div className="text-xs text-mt">
                                    已添加 <span className="font-num font-bold text-ac">{schemes.length}</span> / 6 个方案
                                </div>
                                <button onClick={handleClear}
                                        className="text-xs px-4 py-2 rounded-lg border border-bdr text-mt bg-transparent cursor-pointer transition-all duration-200 hover:text-fg hover:border-bdr-h hover:bg-bdr">
                                    清空全部
                                </button>
                            </div>
                        )}
                        <section aria-label="方案对比区域">
                            {schemes.length === 0 ? (
                                <div className="flex flex-col items-center justify-center py-20 text-mt text-center">
                                    <span className="material-symbols-rounded mb-3.5" style={{ fontSize: 52, opacity: 0.2 }}>compare_arrows</span>
                                    <p className="text-sm font-medium">设置参数后点击「添加到对比」</p>
                                    <p className="text-xs mt-1" style={{ opacity: 0.5 }}>支持小数年限，如 1.5 年、25.5 年，上不封顶</p>
                                </div>
                            ) : (
                                <div className="flex gap-5 overflow-x-auto pb-6 hscroll snap-x snap-proximity" style={{ WebkitOverflowScrolling: 'touch' }}>
                                    {schemes.map(s => (
                                        <CompareCard key={s.id} data={s} isBest={s.id === bestId} onRemove={handleRemove} />
                                    ))}
                                    <div className="flex-shrink-0 w-5"></div>
                                </div>
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
